<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — أهل محمد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-head">
                <span class="auth-logo">🕌</span>
                <h1>قرية أهل محمد</h1>
                <p>لوحة التحكم والإدارة</p>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="auth-form">
                <h2>تسجيل الدخول</h2>
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="dash-input auth-input" placeholder="you@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPass">كلمة المرور</label>
                    <input type="password" id="loginPass" class="dash-input auth-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">دخول</button>
                <p id="loginMsg" class="auth-msg"></p>
                <p class="auth-switch">لا يوجد حساب بعد؟ <a href="#" id="gotoRegister">إنشاء حساب مسؤول</a></p>
            </form>

            <!-- نموذج إنشاء الحساب الأول -->
            <form id="registerForm" class="auth-form hidden">
                <h2>إنشاء حساب مسؤول</h2>
                <p class="auth-note">المسؤول الأول يُنشئ الحساب، وبعدها يتم تسجيل الدخول بالبريد وكلمة المرور.</p>
                <div class="form-group">
                    <label for="regName">الاسم</label>
                    <input type="text" id="regName" class="dash-input auth-input" placeholder="اسمك الكامل">
                </div>
                <div class="form-group">
                    <label for="regEmail">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="dash-input auth-input" placeholder="you@email.com">
                </div>
                <div class="form-group">
                    <label for="regPass">كلمة المرور</label>
                    <input type="password" id="regPass" class="dash-input auth-input" placeholder="على الأقل 6 أحرف">
                </div>
                <div class="form-group">
                    <label for="regPass2">تأكيد كلمة المرور</label>
                    <input type="password" id="regPass2" class="dash-input auth-input" placeholder="أعد كتابة كلمة المرور">
                </div>
                <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
                <p id="registerMsg" class="auth-msg"></p>
                <p class="auth-switch">لديك حساب؟ <a href="#" id="gotoLogin">تسجيل الدخول</a></p>
            </form>

            <a href="index.html" class="auth-back">← العودة إلى الموقع</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
