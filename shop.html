    <section class="shop shop-page section">

            <div class="shop-wrap">
                <div class="shop-main">
                    <h2 class="section-title">متجر <span>القرية</span></h2>

                </div>
            </div>

    <!-- نموذج طلب المتجر -->
    <div id=orderModal class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="تأكيد الطلب">
        <div class="modal-box sweets-box">
            <button class="modal-close" id=orderModalClose>&times;</button>
            <div class="sweets-head">
                <span class="sweets-icon">🛍️</span>
                <h3 class="sweets-title">تأكيد الطلب</h3>
                <p class="sweets-sub" id=orderTitle></p>
            </div>
            <form class="reg-form sweets-form" id=orderForm>
                <div class="form-row">
                    <div class="field">
                        <label for=ordName>الاسم</label>
                        <input type=text id=ordName required placeholder="محمد أمحمد">
                    </div>
                    <div class="field">
                        <label for=ordPhone>الهاتف</label>
                        <input type=tel id=ordPhone placeholder="0555 00 00 00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for=ordQty>الكمية</label>
                        <input type=number id=ordQty value=1 min=1 required>
                    </div>
                    <div class="field">
                        <label for=ordUnit>سعر الوحدة</label>
                        <input type=text id=ordUnit dir=ltr readonly style=text-align:center>
                    </div>
                </div>
                <div class="sw-total" id=ordTotalWrap hidden>
                    <span class=sw-total-label>المجموع الكلي</span>
                    <strong class=sw-total-value id=ordTotalValue>0 دج</strong>
                </div>
                <button type=submit class="btn btn-primary sweets-submit">تأكيد الطلب ✅</button>
            </form>
        </div>
    </div>
